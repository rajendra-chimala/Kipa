<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your KIPA account.">
    <title>Set New Password – KIPA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    {% include 'frontend/partials/favicons.html' %}
</head>

<body class="page-auth">

    {% include 'frontend/partials/preloader.html' %}

    {% include 'frontend/partials/navbar.html' %}

    <main class="auth-container">
        <div class="auth-card fade-up">
            <div class="form-header">
                <h2 style="display:flex;align-items:center;gap:10px;">
                    <i class="fa-solid fa-shield-halved" style="color:var(--primary);font-size:1.4rem;"></i>
                    Set New Password
                </h2>
                <p>Choose a strong new password for your account.</p>
            </div>

            <form id="form-reset-password" onsubmit="handleResetPassword(event)">
                <div id="reset-error" class="alert alert-danger hidden"></div>
                <div id="reset-success" class="alert alert-success hidden"></div>

                <input type="hidden" id="reset-token" name="token" value="{{ token or '' }}">

                <div class="form-group">
                    <label for="reset-new-password">New Password <span style="color:var(--primary);">*</span></label>
                    <div class="password-input-wrap">
                        <input type="password" id="reset-new-password" name="new_password"
                            placeholder="Enter new password (min 6 chars)" required minlength="6"
                            autocomplete="new-password">
                        <button type="button" class="toggle-password-btn"
                            onclick="togglePasswordVisibility('reset-new-password', this)" title="Show/Hide Password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reset-confirm-password">Confirm New Password <span
                            style="color:var(--primary);">*</span></label>
                    <div class="password-input-wrap">
                        <input type="password" id="reset-confirm-password" name="confirm_password"
                            placeholder="Confirm new password" required autocomplete="new-password">
                        <button type="button" class="toggle-password-btn"
                            onclick="togglePasswordVisibility('reset-confirm-password', this)"
                            title="Show/Hide Password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-submit-reset" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-check" style="margin-right:6px;"></i> Update Password
                </button>

                <div class="forgot-password-wrap" style="margin-top:20px;justify-content:center;">
                    <a href="{{ url_for('auth_page') }}" class="forgot-password-link">
                        <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i> Back to Sign In
                    </a>
                </div>
            </form>
        </div>
    </main>

    {% include 'frontend/partials/footer.html' %}

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            const form = event.target;
            const btn = form.querySelector('button[type="submit"]');
            const errorDiv = document.getElementById('reset-error');
            const successDiv = document.getElementById('reset-success');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            const token = document.getElementById('reset-token').value.trim();
            const newPassword = document.getElementById('reset-new-password').value;
            const confirmPassword = document.getElementById('reset-confirm-password').value;

            if (!token) {
                errorDiv.textContent = "Invalid or missing reset token. Please request a new link.";
                errorDiv.classList.remove('hidden');
                return;
            }
            if (newPassword.length < 6) {
                errorDiv.textContent = "New password must be at least 6 characters long.";
                errorDiv.classList.remove('hidden');
                return;
            }
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = "Passwords do not match.";
                errorDiv.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating Password...';

            const formData = new FormData(form);

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    successDiv.innerHTML = `<i class="fa-solid fa-circle-check" style="margin-right:6px;"></i> ${result.message}`;
                    successDiv.classList.remove('hidden');
                    form.reset();
                    setTimeout(() => { window.location.href = '/auth'; }, 2000);
                } else {
                    errorDiv.textContent = result.message || "Failed to update password.";
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = "Server connection error. Please try again.";
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = origText;
            }
        }
    </script>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
